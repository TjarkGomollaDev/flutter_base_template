name: flutter_base_template
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  meta: ^1.17.0
  bloc: ^9.2.1
  shared_preferences: ^2.5.5
  uuid: ^4.5.3
  go_router: ^17.2.3
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  dio: ^5.9.2
  logger: ^2.7.0
  equatable: ^2.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # Provides the in-memory SharedPreferencesAsync platform used to mock
  # persistence in host-VM widget tests (see test/widget_test.dart).
  shared_preferences_platform_interface: ^2.4.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
        - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
        - asset: assets/fonts/Poppins/Poppins-ExtraBold.ttf
