name: flutter_base_template
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  get_it: ^9.3.0
  meta: ^1.17.0
  shared_preferences: ^2.5.6
  uuid: ^4.6.0
  go_router: ^17.3.0
  intl: ^0.20.2
  dio: ^5.11.1
  logger: ^2.8.0
  equatable: ^2.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  # In-memory SharedPreferencesAsync platform used to mock persistence in tests.
  shared_preferences_platform_interface: ^2.4.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
